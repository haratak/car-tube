name: Android

on:
  pull_request:
  push:
    tags:
      - "v*"

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and debug APK
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and assemble debug
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest assembleDebug :installer:assembleDebug lintDebug --stacktrace

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is empty"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/release.p12"
          if [ ! -s "$RUNNER_TEMP/release.p12" ]; then
            echo "Decoded keystore is empty"
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Test and assemble signed release
        env:
          REQUIRE_SIGNING: "true"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          pick_signed_release_apk() {
            local dir="$1"
            local label="$2"
            if [ ! -d "$dir" ]; then
              echo "$label release directory missing: $dir"
              return 1
            fi
            local apk
            apk=$(find "$dir" -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)
            if [ -n "$apk" ]; then
              echo "$apk"
              return 0
            fi
            echo "$label signed release APK was not produced under $dir"
            echo "APKs present:"
            find "$dir" -maxdepth 1 -type f -name '*.apk' -print || true
            return 1
          }

          apk=$(pick_signed_release_apk "app/build/outputs/apk/release" "CarTube")
          cp "$apk" "car-tube-${version}.apk"
          inst=$(pick_signed_release_apk "installer/build/outputs/apk/release" "Installer")
          cp "$inst" "car-tube-installer-${version}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            car-tube-*.apk
            car-tube-installer-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            CarTube ${{ github.ref_name }} の APK です。
            駐車中・同乗者向けです。運転中は操作も視聴もしないでください。
            入れ方は README に書いてあります。
